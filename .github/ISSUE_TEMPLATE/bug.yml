name: Bug Report
description: Report a problem with the Wi-Fi hotspot
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem. What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Open the GUI
        2. Click Start
        3. ...

  - type: textarea
    id: hardware
    attributes:
      label: Hardware report
      description: |
        Please paste the output of:
        ```bash
        uname -r; lsb_release -ds; gnome-shell --version
        iw list | grep -A8 "valid interface combinations"
        iw phy phy0 info | grep -iE "Band [0-9]|MFP|SAE|AP"
        lspci -k | grep -A3 -i network
        ```
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        If the hotspot failed to start, paste the output of:
        ```bash
        sudo wifi-hotspot start
        sudo cat /run/hotspot-hostapd.log
        sudo iptables -S | grep HS_
        ```
      render: text
