name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -S warning src/wifi-hotspot install.sh uninstall.sh

      - name: Bash syntax check
        run: |
          bash -n src/wifi-hotspot
          bash -n install.sh
          bash -n uninstall.sh

      - name: Python compile check
        run: python3 -m py_compile src/wifi-hotspot-gui

      - name: Python lint (ruff)
        run: |
          pip install ruff
          ruff check --select E9,F src/wifi-hotspot-gui

      - name: PolicyKit XML lint
        run: |
          sudo apt-get install -y libxml2-utils
          xmllint --noout data/local.sudar.hotspot.policy

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      # all system tools (iw, iptables, tc, hostapd...) are stubbed by tests/test_helper.bash
      - name: Run tests
        run: bats tests/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Install packaging tools
        run: sudo apt-get install -y dpkg-dev apt-utils

      # ── Tarball ──
      - name: Build tarball
        run: |
          D="wifi-hotspot-${VERSION}"
          mkdir -p "$D/src" "$D/data" "$D/gnome-extension"
          cp src/wifi-hotspot src/wifi-hotspot-gui "$D/src/"
          cp data/local.sudar.hotspot.policy data/local.sudar.Hotspot.desktop data/90-hotspot-ap0.conf "$D/data/"
          cp gnome-extension/metadata.json gnome-extension/extension.js "$D/gnome-extension/"
          cp install.sh uninstall.sh LICENSE README.md CHANGELOG.md "$D/"
          # smoke test: every file install.sh references must be in the bundle
          for f in $(grep -oE '(src|data|gnome-extension)/[A-Za-z0-9._-]+' install.sh | sort -u); do
            [ -f "$D/$f" ] || { echo "missing from tarball: $f"; exit 1; }
          done
          tar czf "$D.tar.gz" "$D"
          sha256sum "$D.tar.gz" > SHA256SUMS

      # ── .deb package ──
      - name: Build .deb
        run: bash packaging/build-deb.sh "$VERSION"

      # ── APT repository on GitHub Pages ──
      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Build APT repository
        run: |
          mkdir -p apt-repo/pool/main
          mkdir -p apt-repo/dists/stable/main/binary-all

          cp build/wifi-hotspot_*_all.deb apt-repo/pool/main/

          cd apt-repo
          dpkg-scanpackages --multiversion pool/ > dists/stable/main/binary-all/Packages
          gzip -k dists/stable/main/binary-all/Packages

          cd dists/stable
          apt-ftparchive release . > Release
          gpg --batch --yes --armor --detach-sign -o Release.gpg Release
          gpg --batch --yes --armor --clearsign  -o InRelease  Release
          cd ../..

          # Public key and setup script
          gpg --armor --export > gpg.key
          cp "$GITHUB_WORKSPACE/packaging/setup-repo.sh" setup.sh

      - name: Deploy APT repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apt-repo
          keep_files: false

      # ── GitHub Release ──
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wifi-hotspot-*.tar.gz
            build/wifi-hotspot_*_all.deb
            SHA256SUMS
          prerelease: false
          generate_release_notes: true
